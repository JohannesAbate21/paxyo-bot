# Step 1: create the Fly.io app in the personal organisation.
# Diagnostic run #2 proved the token sees exactly one org:
# name "Johannes Abate", slug "personal" — NOT "johannes-abate".
# No code is deployed by this workflow. Once the app exists, the
# bot's secrets are set in the Fly dashboard (copied from Render),
# and a later push of the deploy workflow runs the real deploy.
name: Create Fly.io app

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fly-deploy.yml
  workflow_dispatch:

jobs:
  create-app:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl apps create paxorder-bot --org personal
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
