# Deploy @paxorder_bot to Fly.io.
# Runs on every push that touches the bot, and manually.
# Needs the repo secret FLY_API_TOKEN and the app "paxorder-bot"
# to exist already, with its 14 secrets set in the Fly dashboard.
# Fly.io builds the Docker image remotely — no local Docker needed.
# On startup the bot sets its Telegram webhook to
# https://paxorder-bot.fly.dev/<token-path>, taking over from Render.
# The deploy ends with exactly ONE machine: Fly's first deploy
# created two (high-availability default) and two machines would
# cost about $7.38/month — over the $5 waiver. One machine is
# about $3.69/month, waived to $0. The scale step runs after every
# deploy so the count can never drift back to two.
name: Deploy to Fly.io

on:
  push:
    branches:
      - main
    paths:
      - bot.py
      - requirements.txt
      - Dockerfile
      - fly.toml
      - combined-services-2026-11-15.with-times.json
      - .github/workflows/fly-deploy.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: flyctl scale count 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
