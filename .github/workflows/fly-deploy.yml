# Diagnostic: list the Fly.io organisations and apps the saved
# FLY_API_TOKEN can actually see. The create step failed with
# "organization johannes-abate not found", so the real org slug
# must be read from flyctl itself before creating the app.
# No app is created and nothing is deployed by this workflow.
name: Create Fly.io app

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fly-deploy.yml
  workflow_dispatch:

jobs:
  create-app:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl orgs list
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: flyctl apps list
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
