# Step 1: create the Fly.io app in the johannes-abate organisation.
# The Fly dashboard would only offer the "Personal" organisation, so
# the app is created here instead, with the FLY_API_TOKEN org token
# (repo secret, already saved). No code is deployed by this workflow.
# Once the app exists, the bot's secrets are set in the Fly dashboard
# (copied from the Render service env vars), and a later push of the
# deploy workflow runs the real deploy.
name: Create Fly.io app

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fly-deploy.yml
  workflow_dispatch:

jobs:
  create-app:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl apps create paxorder-bot --org johannes-abate || echo "app may already exist"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
